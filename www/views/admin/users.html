<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="iSeeGrass admin — manage platform users.">
    <title>Users | iSeeGrass Admin</title>

    <link rel="icon" type="image/png" href="../../public/icons/favicon.png">

    <!-- Tabler -->
    <link rel="stylesheet" href="../../resources/tabler/css/tabler.css">
    <link rel="stylesheet" href="../../resources/tabler/css/tabler.min.css">

    <!-- Tabler Icons webfont -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.48.0/dist/tabler-icons.min.css">

    <!-- iSeeGrass shared navbar styles -->
    <link rel="stylesheet" href="../../public/css/users/styles-users.css">
    <!-- iSeeGrass Admin Theme -->
    <link rel="stylesheet" href="../../public/css/admin/styles-admin.css">
    <link rel="stylesheet" href="../../public/css/admin/users/styles-admin-users.css">
</head>

<body>
    <div class="page" id="main-content">
        <isee-navbar-admin></isee-navbar-admin>

        <div class="page-wrapper">
            <!-- Page header -->
            <div class="page-header d-print-none">
                <div class="container-xl">
                    <div class="row g-2 align-items-center">
                        <div class="col">
                            <h2 class="page-title text-primary">&gt; Admin / Users</h2>
                        </div>
                    </div>
                </div>
            </div>

            <div class="page-body">
                <div class="container-xl">

                    <div class="admin-card">

                        <!-- Filter bar -->
                        <div class="admin-filter-bar">
                            <input type="text" id="filterSearch" class="admin-input"
                                placeholder="Search by name or email…" style="flex:1; min-width:200px;">
                            <select id="filterRole" class="admin-select">
                                <option value="">All Roles</option>
                                <option value="user">User</option>
                                <option value="admin">Admin</option>
                            </select>
                            <select id="filterStatus" class="admin-select">
                                <option value="">All Status</option>
                                <option value="active">Active</option>
                                <option value="inactive">Inactive</option>
                            </select>
                            <button id="btnResetFilters" class="admin-btn admin-btn--ghost">Reset</button>
                        </div>

                        <!-- Table -->
                        <div class="admin-table-wrapper">
                            <table class="admin-table" id="usersTable">
                                <thead>
                                    <tr>
                                        <th>#</th>
                                        <th>Name</th>
                                        <th>Email</th>
                                        <th>Role</th>
                                        <th>Status</th>
                                        <th>Joined</th>
                                        <th>Actions</th>
                                    </tr>
                                </thead>
                                <tbody id="usersTableBody">
                                    <!-- JS-populated -->
                                    <tr>
                                        <td>1</td>
                                        <td>Jane Santos</td>
                                        <td>jane.santos@example.com</td>
                                        <td><span class="badge badge-green">User</span></td>
                                        <td><span class="badge badge-green">Active</span></td>
                                        <td>2024-01-15</td>
                                        <td>
                                            <div class="action-btn-group">
                                                <button class="admin-btn admin-btn--icon" title="Edit"><i class="ti ti-edit"></i></button>
                                                <button class="admin-btn admin-btn--icon admin-btn--danger" title="Deactivate"><i class="ti ti-user-off"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>2</td>
                                        <td>Marco Reyes</td>
                                        <td>marco.reyes@example.com</td>
                                        <td><span class="badge badge-yellow">Admin</span></td>
                                        <td><span class="badge badge-green">Active</span></td>
                                        <td>2023-11-02</td>
                                        <td>
                                            <div class="action-btn-group">
                                                <button class="admin-btn admin-btn--icon" title="Edit"><i class="ti ti-edit"></i></button>
                                                <button class="admin-btn admin-btn--icon admin-btn--danger" title="Deactivate"><i class="ti ti-user-off"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                    <tr>
                                        <td>3</td>
                                        <td>Ana Lim</td>
                                        <td>ana.lim@example.com</td>
                                        <td><span class="badge badge-green">User</span></td>
                                        <td><span class="badge badge-muted">Inactive</span></td>
                                        <td>2024-03-08</td>
                                        <td>
                                            <div class="action-btn-group">
                                                <button class="admin-btn admin-btn--icon" title="Edit"><i class="ti ti-edit"></i></button>
                                                <button class="admin-btn admin-btn--icon admin-btn--danger" title="Delete"><i class="ti ti-trash"></i></button>
                                            </div>
                                        </td>
                                    </tr>
                                </tbody>
                            </table>
                        </div>

                        <!-- Pagination -->
                        <div class="admin-pagination" id="usersPagination">
                            <button class="admin-btn admin-btn--ghost" id="btnPrevPage">
                                <i class="ti ti-chevron-left"></i> Prev
                            </button>
                            <span class="admin-page-indicator" id="pageIndicator">Page 1</span>
                            <button class="admin-btn admin-btn--ghost" id="btnNextPage">
                                Next <i class="ti ti-chevron-right"></i>
                            </button>
                        </div>

                    </div><!-- /.admin-card -->

                </div><!-- /container-xl -->
            </div><!-- /page-body -->
        </div><!-- /page-wrapper -->
    </div><!-- /page -->

    <script type="module" src="../../components/navbar-admin.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tabler/core@1.4.0/dist/js/tabler.min.js"></script>
    <script src="../../public/js/admin/users/script-admin-users.js"></script>
    <!-- Android back-button handler (no-op on web) -->
    <script src="/js/back-handler.js"></script>
</body>

</html>
