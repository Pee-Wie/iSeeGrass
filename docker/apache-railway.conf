<VirtualHost *:80>
    # DocumentRoot points to www/ — this is where the front-end lives.
    # API calls to /core/api/* are aliased back up one level.
    DocumentRoot /var/www/html/www

    # Alias /core/api/ back to the actual core/api/ directory above www/
    # This allows the front-end to call /core/api/auth/login.php etc.
    Alias /core /var/www/html/core

    <Directory /var/www/html/www>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/core>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
