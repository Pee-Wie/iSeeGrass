<VirtualHost *:80>
    # DocumentRoot points to www/ — this is where the front-end lives.
    # API calls to /core/api/* are aliased back up one level.
    DocumentRoot /var/www/html/www

    # Alias /core → core/ so the front-end can call /core/api/auth/login.php
    Alias /core /var/www/html/core

    # Alias /api → core/api/ so the native app (and any REST client) can call
    # /api/auth/login, /api/auth/me, /api/assessments, etc. without the /core prefix.
    Alias /api /var/www/html/core/api

    <Directory /var/www/html/www>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    <Directory /var/www/html/core>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    # /api alias points into core/api — same permissions as core/
    <Directory /var/www/html/core/api>
        Options -Indexes
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
